name: Linux release packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build
        required: true
        default: v1.0.544
        type: string
      documentation_only:
        description: Attach the matching bilingual offline site and supporting files after a successful Linux run
        type: boolean
        default: false
      source_ref:
        description: Optional source revision to stage before replacing an existing release
        type: string
        default: ''
      website_ref:
        description: Website snapshot ref (defaults to the website/ directory on dunelegacy-tornie)
        type: string
        default: dunelegacy-tornie
      publish_packages:
        description: Attach the built Linux packages to the release
        type: boolean
        default: true
      replace_packages:
        description: Publish staged Linux and Windows artifacts from the two verified runs
        type: boolean
        default: false
      verified_linux_run:
        description: Successful Linux package run ID (required for documentation_only)
        type: string
        default: ''
      verified_windows_run:
        description: Successful Windows package run ID (optional for documentation_only)
        type: string
        default: ''
      followup_545:
        description: Targeted Tharpique, aircraft counters, Radar and Westwood corrections for 545
        type: boolean
        default: false
      ui_only:
        description: UI-only replacement (CTest, startup and packaged FR/EN frames, menus and radar)
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: linux-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-linux:
    if: ${{ !inputs.documentation_only && !inputs.replace_packages }}
    # Ubuntu 22.04 keeps glibc compatibility with Linux Mint 21 and remains compatible with Mint 22.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.release_tag }}

      - name: Confirm release tag and source version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || 'v1.0.544' }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version tag"; exit 1; }
          VERSION=$(sed -n 's/^project(DuneLegacyTornie VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' CMakeLists.txt)
          test "v$VERSION" = "$RELEASE_TAG"
          if [[ "$RELEASE_TAG" == "v1.0.533" ]]; then
            test "$(git rev-parse HEAD)" = "e1ce006ded1584164873e7416d95547670c384ec"
          fi

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: linux-${{ hashFiles('vcpkg.json', 'packaging/linux/build-dependencies.txt') }}

      # vcpkg builds several autotools-based ports from source on Linux
      # (libxcrypt, sdl2-mixer's flac/opus/etc.) and needs the GNU build
      # toolchain pre-installed on the runner. Without these the Configure
      # step fails with: "libxcrypt currently requires ... autoconf
      # autoconf-archive automake libtoolize". Also pulling in
      # build-essential + libltdl-dev so any other transitive port that
      # needs them is happy.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf autoconf-archive automake libtool libltdl-dev \
            build-essential pkg-config bison flex \
            $(cat packaging/linux/build-dependencies.txt) rpm xvfb xauth pulseaudio libpulse0

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          # X11 development headers change SDL capabilities without changing its
          # vcpkg ABI. Never restore the older cache built without XRandR.
          key: vcpkg-linux-x64-${{ hashFiles('vcpkg.json', 'packaging/linux/build-dependencies.txt') }}

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      # run-vcpkg sets VCPKG_BINARY_SOURCES to 'clear;x-gha,readwrite' but
      # the x-gha backend was removed from vcpkg. The 'clear' prefix also
      # disables the default file-based cache. Override to use files-based
      # caching backed by the actions/cache step above.
      - name: Fix vcpkg binary caching
        run: echo "VCPKG_BINARY_SOURCES=clear;files,$HOME/.cache/vcpkg/archives,readwrite" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: cmake -B build -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=Release -DDUNELEGACY_BUILD_TESTS=ON -DVCPKG_MANIFEST_FEATURES=tests

      - name: Require SDL monitor detection and PulseAudio
        run: |
          CONFIG=$(find build/vcpkg_installed -path '*/include/SDL2/SDL_config.h' -print -quit)
          test -n "$CONFIG"
          grep -E '^#define SDL_VIDEO_DRIVER_X11_XRANDR 1' "$CONFIG"
          grep -E '^#define SDL_AUDIO_DRIVER_PULSEAUDIO 1' "$CONFIG"

      - name: Build
        # Limit to 2 parallel jobs — ubuntu-latest has 4 cores but only 7GB
        # RAM, and 4 concurrent g++ -O2 processes on large TUs exceed that.
        run: cmake --build build --config Release --parallel 2

      - name: Verify engine and three-player Internet relay
        run: ctest --test-dir build --output-on-failure

      - name: Create Linux Packages
        run: |
          cd build
          cmake --install . --prefix install --config Release
          test -f install/share/DuneLegacyTornie/locale/French.fr.po || { echo "::error::French catalog is missing from the Linux install tree."; exit 1; }
          test -f install/share/DuneLegacyTornie/ANEU.VOC || { echo "::error::ANEU.VOC is missing from the Linux install tree."; exit 1; }
          test -f install/share/DuneLegacyTornie/EliteSiegeTank.png || { echo "::error::EliteSiegeTank.png is missing from the Linux install tree."; exit 1; }
          cpack -G "DEB;RPM;TGZ" -C Release

      - name: Create AppImage
        run: |
          # Download linuxdeploy (fuse-less FUSE_APPIMAGE_EXTRACT_AND_RUN avoids
          # "fuse: device not found" errors on GitHub-hosted runners)
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

          # Stage the AppDir from the cmake install tree
          cd build
          cmake --install . --prefix AppDir/usr --config Release
          test -f AppDir/usr/share/DuneLegacyTornie/locale/French.fr.po || { echo "::error::French catalog is missing from the AppImage install tree."; exit 1; }

          # Ensure icons and desktop file are in the right AppDir locations
          mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/128x128/apps
          cp ../dunelegacy-tornie.desktop AppDir/usr/share/applications/
          cp ../dunelegacy-tornie-128x128.png AppDir/usr/share/icons/hicolor/128x128/apps/dunelegacy-tornie.png

          # linuxdeploy bundles the binary's shared-library dependencies into the
          # AppDir, generates AppRun, and creates the final .AppImage
          ARCH=x86_64 FUSE_APPIMAGE_EXTRACT_AND_RUN=1 \
            ../linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --custom-apprun ../packaging/linux/AppRun \
            --library /usr/lib/x86_64-linux-gnu/libpulse.so.0 \
            --library /usr/lib/x86_64-linux-gnu/libXrandr.so.2 \
            --executable AppDir/usr/bin/dunelegacy \
            --desktop-file AppDir/usr/share/applications/dunelegacy-tornie.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/128x128/apps/dunelegacy-tornie.png \
            --output appimage

          # Rename with version for clarity
          VERSION=$(sed -n 's/^project(DuneLegacyTornie VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' ../CMakeLists.txt)
          for image in ./*.AppImage; do
            mv "$image" "DuneLegacyTornie-${VERSION}-Linux-x86_64.AppImage"
            break
          done

      - name: Create the Mint compatibility AppImage
        run: |
          cd build
          sed '2i export DUNELEGACY_MINT_COMPAT=1' ../packaging/linux/AppRun > MintAppRun
          chmod +x MintAppRun
          ARCH=x86_64 FUSE_APPIMAGE_EXTRACT_AND_RUN=1 \
            ../linuxdeploy-x86_64.AppImage \
            --appdir AppDir --custom-apprun MintAppRun \
            --executable AppDir/usr/bin/dunelegacy \
            --desktop-file AppDir/usr/share/applications/dunelegacy-tornie.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/128x128/apps/dunelegacy-tornie.png \
            --output appimage
          VERSION=$(sed -n 's/^project(DuneLegacyTornie VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' ../CMakeLists.txt)
          GENERATED=$(find . -maxdepth 1 -name '*.AppImage' ! -name 'DuneLegacyTornie-*' -print -quit)
          test -n "$GENERATED"
          mv "$GENERATED" "DuneLegacyTornie-${VERSION}-Linux-Mint-Compatible.AppImage"

      - name: Verify the packaged graphical startup and software fallback
        run: |
          set -euo pipefail
          trap 'status=$?; if [[ "$status" != 0 && -n "${PROFILE:-}" ]]; then tail -n 120 "$PROFILE/startup.log" 2>/dev/null || true; tail -n 80 "$PROFILE/fallback.log" 2>/dev/null || true; fi; exit "$status"' EXIT
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=dune_startup
          for IMAGE in "$PWD"/build/DuneLegacyTornie-*.AppImage; do
            for LANGUAGE in en fr; do
              for CASE in window fullscreen stale; do
                PROFILE=$(mktemp -d)
                mkdir -p "$PROFILE/DuneLegacyTornie"
                WIDTH=1280; HEIGHT=720; FULLSCREEN=false; EXPECTED=1280x720; MODE=--window
                if [[ "$CASE" == fullscreen ]]; then FULLSCREEN=true; MODE=--fullscreen; fi
                if [[ "$CASE" == stale ]]; then WIDTH=3840; HEIGHT=1080; EXPECTED=1920x1080; fi
                printf '[General]\nLanguage=%s\nPlay Intro=false\n[Video]\nFullscreen=%s\nPhysical Width=%s\nPhysical Height=%s\n' "$LANGUAGE" "$FULLSCREEN" "$WIDTH" "$HEIGHT" > "$PROFILE/DuneLegacyTornie/Dune Legacy.ini"
                XDG_CONFIG_HOME="$PROFILE" DUNELEGACY_PROFILE_DIR="$PROFILE" \
                SDL_AUDIODRIVER=pulseaudio DUNELEGACY_EXPECT_VIDEO_SIZE="$EXPECTED" \
                  timeout 60 xvfb-run -a -s '-screen 0 1920x1080x24 -noreset' "$IMAGE" --appimage-extract-and-run --verify-video "$MODE" > "$PROFILE/startup.log" 2>&1
                grep 'STARTUP CHECK PASSED' "$PROFILE/startup.log"
                grep 'VIDEO CHECK PASSED' "$PROFILE/startup.log"
              done
            done
          done
          PROFILE=$(mktemp -d)
          XDG_CONFIG_HOME="$PROFILE" SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            timeout 60 ./build/bin/dunelegacy --verify-startup --showlog --window > "$PROFILE/fallback.log" 2>&1
          grep 'STARTUP CHECK PASSED.*renderer=software' "$PROFILE/fallback.log"

      - name: Verify packaged co-op construction, editor ownership and Rebels mentat
        if: ${{ !(inputs.ui_only || inputs.followup_545) }}
        run: |
          set -euo pipefail
          PROFILE=$(mktemp -d)
          mkdir -p "$PROFILE/profile" "$PROFILE/results"
          IMAGE=$(find "$PWD/build" -maxdepth 1 -name '*Mint-Compatible.AppImage' -print -quit)
          test -n "$IMAGE"
          for CHECK in --verify-coop-expanded --verify-release543 --verify-harvester-crush; do
            SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy SDL_RENDER_DRIVER=software \
              XDG_CONFIG_HOME="$PROFILE/profile" DUNELEGACY_PROFILE_DIR="$PROFILE/profile" \
              DUNELEGACY_SMOKE_DIR="$PROFILE/results" FUSE_APPIMAGE_EXTRACT_AND_RUN=1 \
              "$IMAGE" "$CHECK" --window > "$PROFILE/$CHECK.log" 2>&1
          done
          test "$(grep -c 'EXPANDED COOP PASS:' "$PROFILE/--verify-coop-expanded.log")" -eq 7
          test "$(grep -c 'EDITOR OWNER PASS:' "$PROFILE/--verify-release543.log")" -eq 7
          test "$(grep -c 'REBELS MENTAT PASS:' "$PROFILE/--verify-release543.log")" -eq 4
          test "$(grep -c 'RELEASE 542 PASS:' "$PROFILE/--verify-release543.log")" -eq 7
          test "$(grep -c 'RELEASE 543 PASS:' "$PROFILE/--verify-release543.log")" -eq 7
          test "$(grep -c 'RELEASE 543 ALLIANCES PASS:' "$PROFILE/--verify-release543.log")" -eq 7
          test "$(grep -c 'RELEASE 543 UNITS PASS:' "$PROFILE/--verify-release543.log")" -eq 6
          test "$(grep -c 'RELEASE 543 GRAPHICS PASS:' "$PROFILE/--verify-release543.log")" -eq 6
          test "$(grep -c 'RELEASE 543 NEUTRAL SABOTEUR PASS:' "$PROFILE/--verify-release543.log")" -eq 3
          test "$(grep -c 'RELEASE 543 EDITOR TERRAIN PASS:' "$PROFILE/--verify-release543.log")" -eq 6
          test "$(grep -c 'RELEASE 543 FLAME PORTRAITS PASS:' "$PROFILE/--verify-release543.log")" -eq 3
          test "$(grep -c 'RELEASE 543 EXPANSION PASS:' "$PROFILE/--verify-release543.log")" -eq 7
          test "$(grep -c 'HARVESTER CRUSH PASS:' "$PROFILE/--verify-harvester-crush.log")" -eq 7
          test "$(grep -c 'UPGRADED SALE PASS:' "$PROFILE/--verify-release543.log")" -eq 7
          test "$(grep -c 'PALACE NAPALM PASS:' "$PROFILE/--verify-release543.log")" -eq 7
          test "$(grep -c 'RELEASE 544 ARTWORK PASS:' "$PROFILE/--verify-release543.log")" -eq 6
          test "$(grep -c 'SLOWPOST UPGRADE PASS:' "$PROFILE/--verify-release543.log")" -eq 7

      - name: Verify packaged radar, editor and original campaign movies in French and English
        run: |
          set -euo pipefail
          PROFILE=$(mktemp -d)
          IMAGE=$(find "$PWD/build" -maxdepth 1 -name '*Mint-Compatible.AppImage' -print -quit)
          test -n "$IMAGE"
          echo "POST544_RUNTIME_ROOT=$PROFILE" >> "$GITHUB_ENV"
          for LANGUAGE in en fr; do
            mkdir -p "$PROFILE/$LANGUAGE/profile/DuneLegacyTornie" "$PROFILE/$LANGUAGE/results"
            printf '[General]\nLanguage=%s\nPlay Intro=false\n[Video]\nFullscreen=false\n[Audio]\nMusic Type=adl\nPlay Music=false\n' "$LANGUAGE" > "$PROFILE/$LANGUAGE/profile/DuneLegacyTornie/Dune Legacy.ini"
            CHECKS=(--verify-radar-research --verify-release545)
            if [[ "${{ inputs.ui_only || inputs.followup_545 }}" != true ]]; then CHECKS+=(--verify-editor-followup --verify-campaign-cinema); fi
            for CHECK in "${CHECKS[@]}"; do
              LOG="$PROFILE/$LANGUAGE/$CHECK.log"
              SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy SDL_RENDER_DRIVER=software \
                XDG_CONFIG_HOME="$PROFILE/$LANGUAGE/profile" DUNELEGACY_PROFILE_DIR="$PROFILE/$LANGUAGE/profile" \
                DUNELEGACY_SMOKE_DIR="$PROFILE/$LANGUAGE/results" FUSE_APPIMAGE_EXTRACT_AND_RUN=1 \
                "$IMAGE" "$CHECK" --showlog --window > "$LOG" 2>&1 || { tail -n 120 "$LOG"; exit 1; }
              grep 'PASS:' "$LOG"
            done
            test "$(grep -c 'RADAR RESEARCH PASS:' "$PROFILE/$LANGUAGE/--verify-radar-research.log")" -eq 7
            if [[ "${{ inputs.ui_only || inputs.followup_545 }}" != true ]]; then
            test "$(grep -c 'EDITOR WINDTRAP PASS:' "$PROFILE/$LANGUAGE/--verify-editor-followup.log")" -eq 7
            test "$(grep -c 'CHAOS DEFENCE UPGRADE PASS:' "$PROFILE/$LANGUAGE/--verify-editor-followup.log")" -eq 7
            test "$(grep -c 'CAMPAIGN CINEMA PASS:' "$PROFILE/$LANGUAGE/--verify-campaign-cinema.log")" -eq 7
            test "$(grep -c 'ORIGINAL CINEMA PASS:' "$PROFILE/$LANGUAGE/--verify-campaign-cinema.log")" -eq 1
            fi
            test "$(grep -c 'RELEASE 545 COMPLETE:' "$PROFILE/$LANGUAGE/--verify-release545.log")" -eq 1
            test "$(grep -c 'RELEASE 545 TROOPER PORTRAITS PASS:' "$PROFILE/$LANGUAGE/--verify-release545.log")" -eq 7
            test "$(grep -c 'RELEASE 545 HEALING PASS:' "$PROFILE/$LANGUAGE/--verify-release545.log")" -eq 7
            test "$(grep -c 'RELEASE 545 AIRCRAFT PASS:' "$PROFILE/$LANGUAGE/--verify-release545.log")" -eq 7
            test "$(grep -c 'ORIGINAL CINEMA PASS:' "$PROFILE/$LANGUAGE/--verify-release545.log")" -eq 1
          done

      - name: Upload next-release runtime evidence
        if: always() && env.POST544_RUNTIME_ROOT != ''
        uses: actions/upload-artifact@v4
        with:
          name: Post544-Linux-Runtime-Evidence
          path: |
            ${{ env.POST544_RUNTIME_ROOT }}/**/*.log
            ${{ env.POST544_RUNTIME_ROOT }}/**/results/*.png
            ${{ env.POST544_RUNTIME_ROOT }}/**/results/*.tsv

      - name: Record the exact packaged source
        run: |
          VERSION="$(sed -n 's/^project(DuneLegacyTornie VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' CMakeLists.txt)"
          SOURCE_COMMIT="$(git rev-parse HEAD)" RELEASE_VERSION="$VERSION" UI_ONLY="${{ inputs.ui_only || inputs.followup_545 }}" python3 - <<'PYTHON'
          import json, os, pathlib
          report = {'version':os.environ['RELEASE_VERSION'], 'source':os.environ['SOURCE_COMMIT'], 'workflowSource':os.environ['GITHUB_SHA'], 'run':int(os.environ['GITHUB_RUN_ID']), 'graphicalStartup':{'passed':True,'languages':['en','fr'],'images':['standard','Mint-compatible'],'audio':'PulseAudio','videoCases':['window','fullscreen','stale-combined-desktop'],'xrandr':True},'softwareFallback':True,'engineAndNetworkTests':True,'packagedRuntimeChecks':['expanded-coop','editor-owners','rebels-mentat','rebels-windtrap-upgrade','building-sales','normal-multiplayer-alliances','flame-and-gas-units','magenta-free-zooms','house-colours-and-blue-stars','neutral-saboteur-tier-seven','editor-terrain-blue-stars','original-flame-squad-portraits','precise-close-flame-quad','sales-destruction-and-concrete','sale-button-after-upgrade','easy-sales-75-percent','extended-fallback-units','movement-slowing','saved-chaos-worm-offer','elite-ornithopter','seventy-three-achievements','palace-napalm-and-saved-hazards','harvester-area-guard-crush','completed-upgrade-sales','native-slowpost-editor-icon','impact-only-and-random-palace-napalm','ten-original-artwork-files','scoutpost-slowpost-upgrade','bicolour-vanilla-harvesters','worfinery-displayed-labels'],'nextReleaseChecks':['radar-research-fr-en','chaos-defence-upgrades','editor-preupgraded-windtraps','original-westwood-audio','original-localized-credits','campaign-role-cinematics','faction-portraits-and-golden-campaign-frames','coop-rescue-two-three-four-factions','palace-saboteur-achievement','main-menu-replay-intro'],'networkProtocol':22,'saveVersion':9839}
          report['validationScope'] = 'ui-refinements' if os.environ['UI_ONLY'] == 'true' else 'full'
          if report['validationScope'] == 'ui-refinements':
              report['packagedRuntimeChecks'] = ['radar-price-overlays-and-house-colours-fr-en', 'faction-frame-background-blending-fr-en', 'mod-menu-colours-fr-en', 'inclusive-right-score-frame-edge-fr-en', 'separate-trooper-production-selection-portraits-fr-en']
              report['nextReleaseChecks'] = list(report['packagedRuntimeChecks'])
          if '${{ inputs.followup_545 }}' == 'true':
              report['validationScope'] = 'targeted-545-corrections'
              report['nextReleaseChecks'] += ['tharpique-healing-cadence', 'aircraft-shortcuts-parenthesized-counts-no-selection', 'aircraft-shortcut-faction-colours', 'radar-level-visibility', 'westwood-louder-synchronized-signature']
          pathlib.Path('build/Linux-Build-'+report['version']+'.json').write_text(json.dumps(report,indent=2)+'\n')
          PYTHON

      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: DuneLegacyTornie-Linux-Packages
          path: |
            build/*.deb
            build/*.rpm
            build/*.tar.gz
            build/*.AppImage
            build/Linux-Build-*.json

      - name: Attach all five Linux packages to the existing release
        if: inputs.publish_packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v1.0.544' }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          shopt -s nullglob
          DEB=(build/*.deb)
          RPM=(build/*.rpm)
          TGZ=(build/*.tar.gz)
          APPIMAGE=(build/*.AppImage)
          test "${#DEB[@]}" -eq 1
          test "${#RPM[@]}" -eq 1
          test "${#TGZ[@]}" -eq 1
          test "${#APPIMAGE[@]}" -eq 2
          gh release upload "$RELEASE_TAG" "${DEB[@]}" "${RPM[@]}" "${TGZ[@]}" "${APPIMAGE[@]}" build/Linux-Build-*.json --repo "$GITHUB_REPOSITORY" --clobber
          {
            echo "Linux packages built from $RELEASE_TAG and attached to the existing release."
            echo
            echo "Formats: DEB, RPM, TAR.GZ, standard AppImage and Mint compatibility AppImage."
            echo "Engine tests and the real UDP direct/host-relay regression passed before packaging."
          } >> "$GITHUB_STEP_SUMMARY"

  replace-packages:
    if: ${{ inputs.replace_packages && !inputs.documentation_only }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.release_tag }}
      - name: Verify and publish both staged platforms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v1.0.544' }}
          VERIFIED_LINUX_RUN: ${{ inputs.verified_linux_run }}
          VERIFIED_WINDOWS_RUN: ${{ inputs.verified_windows_run }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$VERIFIED_LINUX_RUN" =~ ^[0-9]+$ && "$VERIFIED_WINDOWS_RUN" =~ ^[0-9]+$ ]]
          exec > >(tee "$RUNNER_TEMP/publication-stage.log") 2>&1
          bash scripts/bump-version.sh --check
          mkdir -p staged/linux staged/windows
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_LINUX_RUN" > staged/linux-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_WINDOWS_RUN" > staged/windows-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_WINDOWS_RUN/jobs?per_page=100" > staged/windows-jobs.json
          gh run download "$VERIFIED_LINUX_RUN" --repo "$GITHUB_REPOSITORY" --name DuneLegacyTornie-Linux-Packages --dir staged/linux
          gh run download "$VERIFIED_WINDOWS_RUN" --repo "$GITHUB_REPOSITORY" --name DuneLegacyTornie-Windows-Installer --dir staged/windows
          # Earlier main-branch runs contain the tested ZIP but no publication
          # report. Reuse that exact payload only after validating its source,
          # successful engine/network/locale jobs and installed runtime steps.
          git fetch --depth=1 origin "${{ github.sha }}"
          git show FETCH_HEAD:scripts/record-verified-windows-artifact.py > "$RUNNER_TEMP/record-verified-windows-artifact.py"
          python3 "$RUNNER_TEMP/record-verified-windows-artifact.py" --staged staged --version "${RELEASE_TAG#v}"
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, subprocess
          version = os.environ['RELEASE_TAG'][1:]
          source = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          for platform, workflow in [('linux','linux-release.yml'),('windows','build.yml')]:
              run = json.load(open('staged/'+platform+'-run.json'))
              root = pathlib.Path('staged')/platform
              build = json.loads((root/(platform.title()+'-Build-'+version+'.json')).read_text(encoding='utf-8-sig'))
              assert run['conclusion'] == 'success' and run['path'] == '.github/workflows/'+workflow
              assert build['source'] == source and build['version'] == version, 'Package source differs from the replacement tag'
              assert build['run'] == run['id'] and build['workflowSource'] == run['head_sha'], 'Package provenance differs from the verified run'
              assert build['engineAndNetworkTests'] is True
              if platform == 'windows':
                  assert build['installedRuntimeChecks'] == ['fr','en'] and build['menuStartupChecks'] == ['fr','en']
                  package = root/build['package']
                  assert package.name == 'DuneLegacyTornie-'+version+'-Windows-x64.zip'
                  assert hashlib.sha256(package.read_bytes()).hexdigest() == build['sha256']
                  assert len(list(root.iterdir())) == 2
              else:
                  assert build['graphicalStartup']['passed'] and build['softwareFallback']
                  assert len(list(root.glob('*.AppImage'))) == 2
                  for extension in ['*.deb','*.rpm','*.tar.gz']: assert len(list(root.glob(extension))) == 1
                  assert len(list(root.iterdir())) == 6
          PYTHON
          # Keep the release tag immutable; audit tooling follows this dispatch.
          git show FETCH_HEAD:scripts/audit-staged-release.py > "$RUNNER_TEMP/audit-staged-release.py"
          python3 "$RUNNER_TEMP/audit-staged-release.py" --staged staged --version "${RELEASE_TAG#v}" --output "staged/Package-Resources-Audit-${RELEASE_TAG#v}.json"
          SOURCE_COMMIT=$(git rev-parse HEAD)
          NEW_RELEASE=false
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" == true ]]; then
              test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')" = "$SOURCE_COMMIT"
              NEW_RELEASE=true
            else
              test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$SOURCE_COMMIT"
            fi
          else
            cat "release_notes/${RELEASE_TAG#v}-FR.md" > "$RUNNER_TEMP/release-notes.md"
            printf '\n---\n\n' >> "$RUNNER_TEMP/release-notes.md"
            cat "release_notes/${RELEASE_TAG#v}-EN.md" >> "$RUNNER_TEMP/release-notes.md"
            gh release create "$RELEASE_TAG" --target "$SOURCE_COMMIT" --draft --title "Dune Legacy Tornie ${RELEASE_TAG#v}" --notes-file "$RUNNER_TEMP/release-notes.md" --repo "$GITHUB_REPOSITORY"
            NEW_RELEASE=true
          fi
          gh release upload "$RELEASE_TAG" staged/linux/* staged/windows/* "staged/Package-Resources-Audit-${RELEASE_TAG#v}.json" --repo "$GITHUB_REPOSITORY" --clobber
          if [[ "$NEW_RELEASE" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
          fi

      - name: Preserve publication failure details
        if: failure()
        run: |
          python3 - <<'PYTHON'
          import os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP'])/'publication-stage.log'
          if path.exists():
              detail = path.read_text(errors='replace')[-3500:]
              detail = detail.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::error title=Publication stage detail::'+detail)
          PYTHON

  release-documents:
    if: ${{ inputs.documentation_only && !inputs.replace_packages }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Verify the packaged source and matching website
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v1.0.544' }}
          VERIFIED_LINUX_RUN: ${{ inputs.verified_linux_run }}
          VERIFIED_WINDOWS_RUN: ${{ inputs.verified_windows_run }}
          WEBSITE_REF: ${{ inputs.website_ref || 'dunelegacy-tornie' }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$VERIFIED_LINUX_RUN" =~ ^[0-9]+$ ]]
          bash scripts/bump-version.sh --check
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_LINUX_RUN" > linux-run.json
          gh release download "$RELEASE_TAG" --pattern "Linux-Build-${RELEASE_TAG#v}.json" --dir .
          python3 - <<'PYTHON'
          import json, subprocess, os
          run = json.load(open('linux-run.json'))
          build = json.load(open('Linux-Build-'+os.environ['RELEASE_TAG'][1:]+'.json'))
          assert run['conclusion'] == 'success', 'Linux package run has not succeeded'
          assert build['source'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'Linux packages use another source'
          assert build['run'] == run['id'] and build['workflowSource'] == run['head_sha'], 'Build provenance differs from the verified run'
          assert run['path'] == '.github/workflows/linux-release.yml', 'Unexpected package workflow'
          PYTHON
          if [[ -n "$VERIFIED_WINDOWS_RUN" ]]; then
            [[ "$VERIFIED_WINDOWS_RUN" =~ ^[0-9]+$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_WINDOWS_RUN" > windows-run.json
            gh release download "$RELEASE_TAG" --pattern "Windows-Build-${RELEASE_TAG#v}.json" --dir .
            python3 - <<'PYTHON'
          import json, subprocess, os
          run = json.load(open('windows-run.json'))
          build = json.load(open('Windows-Build-'+os.environ['RELEASE_TAG'][1:]+'.json', encoding='utf-8-sig'))
          assert run['conclusion'] == 'success', 'Windows package run has not succeeded'
          assert build['source'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'Windows packages use another source'
          assert build['run'] == run['id'] and build['workflowSource'] == run['head_sha'], 'Windows provenance differs from the verified run'
          assert run['path'] == '.github/workflows/build.yml', 'Unexpected Windows workflow'
          PYTHON
          fi
          git fetch --depth=1 origin "$WEBSITE_REF"
          git rev-parse FETCH_HEAD > "$RUNNER_TEMP/website-source.txt"
          mkdir -p offline/DuneLegacyTornie-Site-Local/dist supporting
          if git cat-file -e FETCH_HEAD:website/index.html 2>/dev/null; then
            git archive FETCH_HEAD website | tar -x --strip-components=1 -C offline/DuneLegacyTornie-Site-Local/dist
          else
            # Explicit historical archive tags retain the former root layout.
            git archive FETCH_HEAD | tar -x -C offline/DuneLegacyTornie-Site-Local/dist
          fi
          RELEASE_VERSION="${RELEASE_TAG#v}" node - <<'JAVASCRIPT'
          const fs=require('fs'),vm=require('vm'),c={window:{}};vm.createContext(c);
          vm.runInContext(fs.readFileSync('offline/DuneLegacyTornie-Site-Local/dist/assets/site-data.js','utf8'),c);
          if(c.window.SITE_DATA.version!==process.env.RELEASE_VERSION)throw Error('Website version differs from the release');
          JAVASCRIPT

      - name: Load the current documentation verification script
        run: |
          # The game tag remains immutable; publication tooling follows the
          # workflow revision used for this dispatch.
          git fetch --depth=1 origin "${{ github.sha }}"
          git show FETCH_HEAD:scripts/check-documentation-site.cjs > /tmp/check-documentation-site.cjs
          npm install --prefix "$RUNNER_TEMP/site-checks" playwright@1.56.1

      - name: Assemble and attach release documents
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v1.0.544' }}
          VERIFIED_LINUX_RUN: ${{ inputs.verified_linux_run }}
          VERIFIED_WINDOWS_RUN: ${{ inputs.verified_windows_run }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          git archive --format=zip --prefix="DuneLegacyTornie-$VERSION/" -o "supporting/DuneLegacyTornie-$VERSION-Sources.zip" HEAD
          cp "offline/DuneLegacyTornie-Site-Local/dist/documents/Notes-$VERSION.md" "supporting/Release-Notes-$VERSION-FR.md"
          cp "offline/DuneLegacyTornie-Site-Local/dist/documents/Notes-$VERSION-EN.md" "supporting/Release-Notes-$VERSION-EN.md"
          cp "offline/DuneLegacyTornie-Site-Local/dist/documents/Validation-$VERSION.json" supporting/
          if [[ "$VERSION" == "1.0.545" ]]; then
            gh release download "$RELEASE_TAG" --pattern "Package-Resources-Audit-$VERSION.json" --dir supporting
          fi
          gh release download "$RELEASE_TAG" --pattern '*Linux*' --dir supporting
          test "$(find supporting -maxdepth 1 -name '*.AppImage' | wc -l)" -ge 1
          test "$(find supporting -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
          test "$(find supporting -maxdepth 1 -name '*.rpm' | wc -l)" -eq 1
          test "$(find supporting -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          if [[ -n "$VERIFIED_WINDOWS_RUN" ]]; then
            gh release download "$RELEASE_TAG" --pattern "DuneLegacyTornie-$VERSION-Windows-x64.zip" --pattern "Windows-Build-$VERSION.json" --dir supporting
            python3 - <<'PYTHON'
          import json, hashlib, pathlib, os
          root = pathlib.Path('supporting')
          build = json.loads((root / ('Windows-Build-'+os.environ['RELEASE_TAG'][1:]+'.json')).read_text(encoding='utf-8-sig'))
          assert hashlib.sha256((root / build['package']).read_bytes()).hexdigest() == build['sha256'], 'Windows ZIP differs from the tested package'
          PYTHON
          fi
          cp supporting/* offline/DuneLegacyTornie-Site-Local/dist/documents/
          # The current Linux release explicitly retains the previous Windows
          # download for offline documentation; it is not network-compatible.
          if [[ -z "$VERIFIED_WINDOWS_RUN" ]]; then
            gh release download v1.0.538 --pattern DuneLegacyTornie-1.0.538-Windows-x64.zip --dir offline/DuneLegacyTornie-Site-Local/dist/documents --clobber
          fi
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, subprocess, zipfile
          root = pathlib.Path('supporting')
          website_source = (pathlib.Path(os.environ['RUNNER_TEMP'])/'website-source.txt').read_text().strip()
          report = {'version': os.environ['RELEASE_TAG'][1:], 'source': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(), 'website': website_source, 'linuxRun': int(os.environ['VERIFIED_LINUX_RUN']), 'assets': []}
          if os.environ.get('VERIFIED_WINDOWS_RUN'): report['windowsRun'] = int(os.environ['VERIFIED_WINDOWS_RUN'])
          for path in sorted(root.iterdir()):
              report['assets'].append({'name':path.name,'size':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()})
          (root / ('Publication-Validation-'+report['version']+'.json')).write_text(json.dumps(report,indent=2)+'\n')
          site = pathlib.Path('offline/DuneLegacyTornie-Site-Local/dist')
          (site/'documents'/('Publication-Validation-'+report['version']+'.json')).write_text(json.dumps(report,indent=2)+'\n')
          # Offline checksums describe its embedded files; the public manifest
          # is generated afterwards and also covers the website ZIP itself.
          sums = ''.join(hashlib.sha256(path.read_bytes()).hexdigest()+'  '+path.name+'\n' for path in sorted(root.iterdir()) if path.is_file() and not path.name.startswith('SHA256SUMS-'))
          (site/'documents'/('SHA256SUMS-'+report['version']+'.txt')).write_text(sums)
          with zipfile.ZipFile(root / ('DuneLegacyTornie-Site-Local-'+report['version']+'.zip'),'w',zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(pathlib.Path('offline').rglob('*')):
                  if path.is_file(): archive.write(path,path.relative_to('offline'))
          PYTHON
          SITE_BROWSER="$(command -v google-chrome || command -v chromium)" \
          NODE_PATH="$RUNNER_TEMP/site-checks/node_modules" \
          RELEASE_VERSION="$VERSION" \
          REQUIRE_WINDOWS_VERSION="${VERIFIED_WINDOWS_RUN:+$VERSION}" \
          SITE_VALIDATION_OUTPUT="supporting/Website-Validation-$VERSION.json" \
            node /tmp/check-documentation-site.cjs \
              "file://$GITHUB_WORKSPACE/offline/DuneLegacyTornie-Site-Local/dist/" \
              "https://torneko.github.io/dunelegacy-tornie/"
          (cd supporting && sha256sum * > "SHA256SUMS-$VERSION.txt")
          gh release upload "$RELEASE_TAG" supporting/* --clobber
          echo "Bilingual offline site, tagged sources, notes and SHA-256 checksums attached to $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
