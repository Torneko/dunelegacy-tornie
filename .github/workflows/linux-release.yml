name: Inspect failed video validation
on:
  workflow_dispatch:
    inputs:
      failed_run:
        description: Existing workflow run whose failed test output is needed
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - name: Extract failed test diagnostics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: Torneko/dunelegacy-tornie
          FAILED_RUN: ${{ inputs.failed_run }}
        run: |
          [[ "$FAILED_RUN" =~ ^[0-9]+$ ]]
          gh run view "$FAILED_RUN" --repo "$GH_REPO" --log-failed > failed.log
          python3 - <<'PY'
          import pathlib,re
          lines=pathlib.Path('failed.log').read_text(errors='replace').splitlines()
          selected=set()
          for i,line in enumerate(lines):
            if re.search(r'unhandled exception|runtime check:|FAILED:|test cases:|assertions:|Error:|Exception:|failed\.|failed!|tests failed',line,re.I):
              selected.update(range(max(0,i-1),min(len(lines),i+7)))
          if not selected:selected=set(range(max(0,len(lines)-35),len(lines)))
          message='\n'.join(lines[-160:])[-20000:]
          for offset in range(0,len(message),2800):
            text=message[offset:offset+2800].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
            print('::notice title=Failed test log::'+text)
          PY
