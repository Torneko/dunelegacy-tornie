name: Inspect validation diagnostics
on:
  push:
    branches: [ diagnostics/post-544-engine ]
  workflow_dispatch:
    inputs:
      run_id:
        description: Existing failed validation run to inspect (read only)
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - name: Retrieve failed validation output
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id || '39449801275' }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/validation-failure.log
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/validation-failure.log').read_text(errors='replace').splitlines()
          tail='\n'.join(lines[-100:])[-3000:]
          print(tail)
          print('::notice title=Validation failure detail::'+tail.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Validation-diagnostics-${{ inputs.run_id }}
          path: /tmp/validation-failure.log
