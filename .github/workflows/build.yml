name: Build Dune Legacy

on:
  push:
    branches: [ dunelegacy-tornie ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ dunelegacy-tornie ]
  workflow_dispatch:
    inputs:
      windows_only:
        description: Build and attach only Windows to an existing release
        type: boolean
        default: false
      release_tag:
        description: Existing version tag (required for windows_only)
        type: string
        default: ''
      source_ref:
        description: Optional source revision to stage before replacing an existing release
        type: string
        default: ''
      publish_packages:
        description: Attach the verified Windows package to the release
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate: on v* tag builds, verify that the source-controlled version metadata
  # (CMakeLists.txt, include/config.h, vcpkg.json) already matches the tag.
  # This catches missing bump commits BEFORE any build/release/upload runs.
  verify-version:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.windows_only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || (inputs.windows_only && inputs.release_tag) || github.ref }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify source version matches tag
        env:
          RELEASE_TAG: ${{ inputs.windows_only && inputs.release_tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG_VERSION="${RELEASE_TAG#v}"
          echo "Tag version: $TAG_VERSION"
          bash scripts/bump-version.sh --check
          SOURCE_VERSION=$(sed -n 's/^project(DuneLegacyTornie VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' CMakeLists.txt)
          if [ "$SOURCE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: tag is v${TAG_VERSION} but source metadata says ${SOURCE_VERSION}."
            echo "::error::Commit the version bump with 'scripts/bump-version.sh ${TAG_VERSION}' before tagging."
            exit 1
          fi
          echo "OK â€” all source files agree on $SOURCE_VERSION, matches tag v${TAG_VERSION}"

  test-linux:
    runs-on: ubuntu-latest
    needs: [verify-version]
    if: always() && !inputs.windows_only && (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Audit legacy DuneCity references
        shell: bash
        run: |
          set -e
          if grep -RInE 'DuneCity|Dune City|dunecity' \
              src include tests config mods scripts CMakeLists.txt \
              --exclude='ChangeLog' --exclude='*.md' --exclude='*.txt' \
              --exclude='manifest.json' --exclude='SaveCompatTestCase.cpp' --exclude='SaveCompat.h'; then
            echo "::error::Legacy DuneCity reference found in active project files."
            exit 1
          fi

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libminiupnpc-dev \
            libcurl4-openssl-dev \
            catch2

      - name: Validate supplied spice maps
        run: python3 scripts/add-spice-variants.py --check

      - name: Validate bundled mod payloads
        run: python3 scripts/check-bundled-mods.py

      - name: Configure CMake
        run: cmake -B build -DDUNELEGACY_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Validate campaign plans and region routes
        run: python3 scripts/check-campaign-regions.py

      - name: Build tests
        run: cmake --build build --target dunelegacy dunelegacy_tests --parallel 2

      - name: Run tests
        run: |
          DUNELEGACY_SOURCE_DIR=${{ github.workspace }} \
          DUNELEGACY_DATADIR=${{ github.workspace }}/data \
          ctest --test-dir build --output-on-failure

  validate-french-locale:
    runs-on: ubuntu-latest
    needs: [verify-version]
    if: always() && (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || (inputs.windows_only && inputs.release_tag) || github.ref }}

      - name: Install gettext tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Compile French catalog
        run: msgfmt --check -o /tmp/French.fr.mo data/locale/French.fr.po

      - name: Require explicit French faction labels
        run: python3 scripts/check-french-locale.py

  build-windows:
    runs-on: windows-latest
    # Wait for version check on tag builds; run unconditionally otherwise
    needs: [verify-version]
    if: always() && (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || (inputs.windows_only && inputs.release_tag) || github.ref }}

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Configure CMake
        # Quote the -D arg so PowerShell expands $env:VCPKG_ROOT instead
        # of treating the colon-slash as a literal string. Without the
        # quotes CMake gets the unexpanded path and fails to find the
        # toolchain file.
        run: cmake -B build "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DDUNELEGACY_BUILD_TESTS=ON -DVCPKG_MANIFEST_FEATURES=tests

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run engine and bundled mod checks
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Engine/network CTest failed." }
          $env:DUNELEGACY_USER_DIR = Join-Path $env:RUNNER_TEMP "dunelegacy-smoke-profile"
          New-Item -ItemType Directory -Force -Path $env:DUNELEGACY_USER_DIR | Out-Null
          $env:DUNELEGACY_SMOKE_DIR = $env:DUNELEGACY_USER_DIR
          $env:SDL_VIDEODRIVER = "dummy"
          $env:SDL_AUDIODRIVER = "dummy"
          $env:SDL_RENDER_DRIVER = "software"
          $log = Join-Path $env:RUNNER_TEMP "dunelegacy-mod-smoke.log"
          $process = Start-Process -FilePath "build/bin/Release/dunelegacy.exe" -ArgumentList "--verify-achievements", "--showlog", "--window" -WindowStyle Hidden -Wait -PassThru -RedirectStandardError $log
          Get-Content -LiteralPath $log | Select-String "MOD SMOKE|ACHIEVEMENT SMOKE|unhandled exception|runtime check:"
          if ($process.ExitCode -ne 0) { Get-Content -LiteralPath $log -Tail 120 }
          if ($process.ExitCode -ne 0 -or -not (Select-String -LiteralPath $log -Pattern "MOD SMOKE COMPLETE:")) { throw "Bundled mod runtime checks failed." }
          if (-not (Select-String -LiteralPath $log -Pattern "ACHIEVEMENT SMOKE COMPLETE:")) { throw "Achievement runtime checks failed." }

      - name: Create Installer Package
        run: |
          cd build
          cmake --install . --prefix install --config Release
          if (-not (Test-Path -LiteralPath "install/locale/French.fr.po")) {
            throw "French catalog is missing from the Windows install tree."
          }
          foreach ($asset in @("install/data/ANEU.VOC", "install/data/EliteSiegeTank.png")) {
            if (-not (Test-Path -LiteralPath $asset)) {
              throw "Required loose Windows runtime asset is missing: $asset"
            }
          }
          $env:SDL_VIDEODRIVER = "dummy"
          $env:SDL_AUDIODRIVER = "dummy"
          $env:SDL_RENDER_DRIVER = "software"
          foreach ($language in @("fr", "en")) {
            $env:DUNELEGACY_USER_DIR = Join-Path $env:RUNNER_TEMP "dunelegacy-installed-$language"
            New-Item -ItemType Directory -Force -Path $env:DUNELEGACY_USER_DIR | Out-Null
            $env:DUNELEGACY_SMOKE_DIR = $env:DUNELEGACY_USER_DIR
            Set-Content -LiteralPath (Join-Path $env:DUNELEGACY_USER_DIR "Dune Legacy.ini") -Value "[General]`nLanguage=$language`nPlay Intro=false`n[Video]`nFullscreen=false`n[Audio]`nMusic Type=adl`nPlay Music=false" -Encoding utf8
            $log = Join-Path $env:RUNNER_TEMP "dunelegacy-installed-$language.log"
            $process = Start-Process -FilePath "install/dunelegacy.exe" -ArgumentList "--verify-achievements", "--showlog", "--window" -WindowStyle Hidden -Wait -PassThru -RedirectStandardError $log
            Get-Content -LiteralPath $log | Select-String "MOD SMOKE|ACHIEVEMENT SMOKE|unhandled exception|runtime check:"
            if ($process.ExitCode -ne 0) { Get-Content -LiteralPath $log -Tail 120 }
            if ($process.ExitCode -ne 0 -or -not (Select-String -LiteralPath $log -Pattern "MOD SMOKE COMPLETE:")) { throw "Installed $language mod runtime checks failed." }
            if (-not (Select-String -LiteralPath $log -Pattern "ACHIEVEMENT SMOKE COMPLETE:")) { throw "Installed $language achievement checks failed." }
            foreach ($check in @(@("RELEASE 543 PASS:", 7), @("RELEASE 543 ALLIANCES PASS:", 7), @("RELEASE 543 UNITS PASS:", 6), @("RELEASE 543 GRAPHICS PASS:", 6), @("RELEASE 543 NEUTRAL SABOTEUR PASS:", 3), @("RELEASE 543 EDITOR TERRAIN PASS:", 6), @("RELEASE 543 FLAME PORTRAITS PASS:", 3), @("RELEASE 543 EXPANSION PASS:", 7), @("HARVESTER CRUSH PASS:", 7), @("UPGRADED SALE PASS:", 7), @("PALACE NAPALM PASS:", 7), @("RELEASE 544 ARTWORK PASS:", 6), @("SLOWPOST UPGRADE PASS:", 7), @("EDITOR WINDTRAP PASS:", 7), @("CHAOS DEFENCE UPGRADE PASS:", 7))) {
              if ((Select-String -LiteralPath $log -Pattern $check[0]).Count -ne $check[1]) { throw "Installed $language 543 checks failed: $($check[0])" }
            }
            foreach ($check in @(@("--verify-radar-research", "RADAR RESEARCH PASS:", 7), @("--verify-campaign-cinema", "CAMPAIGN CINEMA PASS:", 7))) {
              $nextLog = Join-Path $env:RUNNER_TEMP "dunelegacy-installed-$language-$($check[0]).log"
              $process = Start-Process -FilePath "install/dunelegacy.exe" -ArgumentList $check[0], "--showlog", "--window" -WindowStyle Hidden -Wait -PassThru -RedirectStandardError $nextLog
              Get-Content -LiteralPath $nextLog | Select-String "PASS:|unhandled exception"
              if ($process.ExitCode -ne 0) { Get-Content -LiteralPath $nextLog -Tail 120 }
              if ($process.ExitCode -ne 0 -or (Select-String -LiteralPath $nextLog -Pattern $check[1]).Count -ne $check[2]) { throw "Installed $language next-release check failed: $($check[0])" }
              if ($check[0] -eq "--verify-campaign-cinema" -and (Select-String -LiteralPath $nextLog -Pattern "ORIGINAL CINEMA PASS:").Count -ne 1) { throw "Original cinema check missing" }
            }
            if (Select-String -LiteralPath "../src/main.cpp" -Pattern 'parameter == "--verify-startup"') {
              $startupLog = Join-Path $env:RUNNER_TEMP "dunelegacy-startup-$language.log"
              $process = Start-Process -FilePath "install/dunelegacy.exe" -ArgumentList "--verify-video", "--showlog", "--window" -WindowStyle Hidden -Wait -PassThru -RedirectStandardError $startupLog
              Get-Content -LiteralPath $startupLog | Select-String "STARTUP CHECK|VIDEO CHECK|unhandled exception"
              if ($process.ExitCode -ne 0) { Get-Content -LiteralPath $startupLog -Tail 120 }
              if ($process.ExitCode -ne 0 -or -not (Select-String -LiteralPath $startupLog -Pattern "STARTUP CHECK PASSED:.*language=$language")) { throw "Installed $language menu startup failed." }
              if (-not (Select-String -LiteralPath $startupLog -Pattern "VIDEO CHECK PASSED:")) { throw "Installed $language video options check failed." }
            }
          }
          cpack -G ZIP -C Release

      - name: Preserve native failure details in check annotations
        if: failure()
        run: |
          foreach ($path in @((Join-Path $env:RUNNER_TEMP "dunelegacy-mod-smoke.log"), "build/Testing/Temporary/LastTest.log")) {
            if (Test-Path -LiteralPath $path) {
              $tail = (Get-Content -LiteralPath $path -Tail 60) -join "`n"
              if ($tail.Length -gt 3000) { $tail = $tail.Substring($tail.Length - 3000) }
              $escaped = $tail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output "::notice title=Native validation detail::$escaped"
            }
          }

      - name: Upload next-release Windows runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Post544-Windows-Runtime-Evidence
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/dunelegacy-installed-*.log
            ${{ runner.temp }}/dunelegacy-mod-smoke.log
            build/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/dunelegacy-installed-*/*radar*.png
            ${{ runner.temp }}/dunelegacy-installed-*/*campaign*.tsv
            ${{ runner.temp }}/dunelegacy-installed-*/original-credits-*.png
            ${{ runner.temp }}/dunelegacy-installed-*/westwood-blue-original.png

      - name: Record Windows package provenance
        if: inputs.windows_only || github.ref == 'refs/heads/publish/544-correctifs'
        run: |
          $version = "${{ inputs.release_tag || 'v1.0.544' }}".Substring(1)
          $package = Get-Item "build/DuneLegacyTornie-$version-Windows-x64.zip"
          $report = @{
            version = $version
            source = (git rev-parse HEAD)
            workflowSource = "${{ github.sha }}"
            run = [long]"${{ github.run_id }}"
            engineAndNetworkTests = $true
            installedRuntimeChecks = @("fr", "en")
            release543Checks = @("building-sales", "normal-multiplayer-alliances", "flame-and-gas-units", "magenta-free-zooms", "house-colours-and-blue-stars", "neutral-saboteur-tier-seven", "editor-terrain-blue-stars", "original-flame-squad-portraits", "precise-close-flame-quad", "sales-destruction-and-concrete", "sale-button-after-upgrade", "easy-sales-75-percent", "extended-fallback-units", "movement-slowing", "saved-chaos-worm-offer", "elite-ornithopter", "seventy-achievements", "palace-napalm-and-saved-hazards", "harvester-area-guard-crush", "completed-upgrade-sales", "native-slowpost-editor-icon", "impact-only-and-random-palace-napalm", "ten-original-artwork-files", "scoutpost-slowpost-upgrade", "bicolour-vanilla-harvesters", "worfinery-displayed-labels")
            nextReleaseChecks = @("editor-native-quad-anchors", "editor-preupgraded-windtraps", "chaos-defence-upgrades", "saved-radar-research", "original-westwood-audio", "original-localized-credits", "campaign-role-cinematics")
            networkProtocol = 21
            saveVersion = 9839
            menuStartupChecks = @("fr", "en")
            videoOptionsChecks = @("fr", "en")
            package = $package.Name
            sha256 = (Get-FileHash $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $report | ConvertTo-Json -Depth 5 | Set-Content "build/Windows-Build-$version.json" -Encoding utf8

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: DuneLegacyTornie-Windows-Installer
          path: |
            build/*.zip
            build/Windows-Build-*.json

  release-windows:
    needs: [verify-version, validate-french-locale, build-windows]
    if: always() && inputs.windows_only && inputs.publish_packages && needs.verify-version.result == 'success' && needs.validate-french-locale.result == 'success' && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DuneLegacyTornie-Windows-Installer
          path: dist/windows
      - name: Attach verified Windows package to the existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" "dist/windows/DuneLegacyTornie-${RELEASE_TAG#v}-Windows-x64.zip" "dist/windows/Windows-Build-${RELEASE_TAG#v}.json" --repo "$GITHUB_REPOSITORY" --clobber

  build-macos:
    # Optional: set the repository variable ENABLE_MACOS_BUILD=true when a
    # compatible self-hosted runner is online.
    # Self-hosted on Stefan's MacBook (8-core arm64) with a warm vcpkg binary
    # cache. GitHub's free hosted macos-14 runner is a 3-core box that took
    # ~70 min per cold build (and its 60-min cap killed a run); this machine
    # builds in ~10 min. The DMG is ad-hoc signed, so no signing certs needed.
    runs-on: [self-hosted, macOS, ARM64]
    needs: [verify-version]
    if: always() && !inputs.windows_only && vars.ENABLE_MACOS_BUILD == 'true' && (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped')
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "8"
    steps:
      - uses: actions/checkout@v4

      - name: Skip macOS build (no ARM64 runner configured)
        run: |
          echo "macOS self-hosted ARM64 runner not configured for this repository."
          echo "Re-add the [self-hosted, macOS, ARM64] runs-on in the main repo"
          echo "when the macOS DMG build is wanted there. This no-op produces a"
          echo "zero-byte placeholder artifact so dev-release/tornie-release can"
          echo "still upload the macOS step (artifact is just absent)."
          mkdir -p build
          touch build/DuneLegacyTornie-macOS-SKIP.txt

  build-linux:
    # Ubuntu 22.04 keeps glibc compatibility with Linux Mint 21 and remains compatible with Mint 22.
    runs-on: ubuntu-22.04
    needs: [verify-version]
    if: always() && !inputs.windows_only && (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: linux-${{ hashFiles('vcpkg.json', 'packaging/linux/build-dependencies.txt') }}

      # vcpkg builds several autotools-based ports from source on Linux
      # (libxcrypt, sdl2-mixer's flac/opus/etc.) and needs the GNU build
      # toolchain pre-installed on the runner. Without these the Configure
      # step fails with: "libxcrypt currently requires ... autoconf
      # autoconf-archive automake libtoolize". Also pulling in
      # build-essential + libltdl-dev so any other transitive port that
      # needs them is happy.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf autoconf-archive automake libtool libltdl-dev \
            build-essential pkg-config bison flex \
            $(cat packaging/linux/build-dependencies.txt) libpulse-dev libasound2-dev

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          # X11 development headers change SDL capabilities without changing its
          # vcpkg ABI. Never restore the older cache built without XRandR.
          key: vcpkg-linux-x64-${{ hashFiles('vcpkg.json', 'packaging/linux/build-dependencies.txt') }}

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      # run-vcpkg sets VCPKG_BINARY_SOURCES to 'clear;x-gha,readwrite' but
      # the x-gha backend was removed from vcpkg. The 'clear' prefix also
      # disables the default file-based cache. Override to use files-based
      # caching backed by the actions/cache step above.
      - name: Fix vcpkg binary caching
        run: echo "VCPKG_BINARY_SOURCES=clear;files,$HOME/.cache/vcpkg/archives,readwrite" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: cmake -B build -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=Release

      - name: Require SDL monitor detection and PulseAudio
        run: |
          CONFIG=$(find build/vcpkg_installed -path '*/include/SDL2/SDL_config.h' -print -quit)
          test -n "$CONFIG"
          grep -E '^#define SDL_VIDEO_DRIVER_X11_XRANDR 1' "$CONFIG"
          grep -E '^#define SDL_AUDIO_DRIVER_PULSEAUDIO 1' "$CONFIG"

      - name: Build
        # Limit to 2 parallel jobs â€” ubuntu-latest has 4 cores but only 7GB
        # RAM, and 4 concurrent g++ -O2 processes on large TUs exceed that.
        run: cmake --build build --config Release --parallel 2

      - name: Create Linux Packages
        run: |
          cd build
          cmake --install . --prefix install --config Release
          test -f install/share/DuneLegacyTornie/locale/French.fr.po || { echo "::error::French catalog is missing from the Linux install tree."; exit 1; }
          test -f install/share/DuneLegacyTornie/ANEU.VOC || { echo "::error::ANEU.VOC is missing from the Linux install tree."; exit 1; }
          test -f install/share/DuneLegacyTornie/EliteSiegeTank.png || { echo "::error::EliteSiegeTank.png is missing from the Linux install tree."; exit 1; }
          cpack -G "DEB;RPM;TGZ" -C Release

      - name: Create AppImage
        run: |
          # Download linuxdeploy (fuse-less FUSE_APPIMAGE_EXTRACT_AND_RUN avoids
          # "fuse: device not found" errors on GitHub-hosted runners)
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

          # Stage the AppDir from the cmake install tree
          cd build
          cmake --install . --prefix AppDir/usr --config Release
          test -f AppDir/usr/share/DuneLegacyTornie/locale/French.fr.po || { echo "::error::French catalog is missing from the AppImage install tree."; exit 1; }

          # Ensure icons and desktop file are in the right AppDir locations
          mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/128x128/apps
          cp ../dunelegacy-tornie.desktop AppDir/usr/share/applications/
          cp ../dunelegacy-tornie-128x128.png AppDir/usr/share/icons/hicolor/128x128/apps/dunelegacy-tornie.png

          # linuxdeploy bundles the binary's shared-library dependencies into the
          # AppDir, generates AppRun, and creates the final .AppImage
          ARCH=x86_64 FUSE_APPIMAGE_EXTRACT_AND_RUN=1 \
            ../linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/dunelegacy \
            --desktop-file AppDir/usr/share/applications/dunelegacy-tornie.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/128x128/apps/dunelegacy-tornie.png \
            --output appimage

          # Rename with version for clarity
          VERSION=$(sed -n 's/^project(DuneLegacyTornie VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' ../CMakeLists.txt)
          for image in ./*.AppImage; do
            mv "$image" "DuneLegacyTornie-${VERSION}-Linux-x86_64.AppImage"
            break
          done

      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: DuneLegacyTornie-Linux-Packages
          path: |
            build/*.deb
            build/*.rpm
            build/*.tar.gz
            build/*.AppImage

  # Rolling dev build: update a "latest-dev" pre-release on every main push
  # so builds are always downloadable from the releases page.
  dev-release:
    needs: [build-windows, build-linux, build-macos]
    if: |
      always() &&
      !inputs.windows_only &&
      github.ref == 'refs/heads/main' &&
      (needs.build-windows.result == 'success' || needs.build-linux.result == 'success' || needs.build-macos.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: DuneLegacyTornie-Windows-Installer
          path: dist/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: DuneLegacyTornie-macOS-DMG
          path: dist/macos

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: DuneLegacyTornie-Linux-Packages
          path: dist/linux

      - name: Update latest-dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(sed -n 's/^project(DuneLegacyTornie VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' CMakeLists.txt)
          SHA="${GITHUB_SHA::8}"
          NOTES="Dev build v${VERSION} (${SHA})\n\nAuto-built from main @ $(date -u '+%Y-%m-%d %H:%M UTC')\n\n**Downloads** (attached below)"

          # Delete old dev release if it exists, then create fresh
          gh release delete latest-dev --yes 2>/dev/null || true
          git push origin :refs/tags/latest-dev 2>/dev/null || true

          # Collect whatever artifacts succeeded
          shopt -s nullglob
          FILES=(dist/*/*)
          if [ ${#FILES[@]} -gt 0 ]; then
            echo -e "$NOTES" | gh release create latest-dev "${FILES[@]}" \
              --title "Dev Build v${VERSION}" \
              --notes-file - \
              --prerelease
          fi

  # Tornie Mod beta build: update a "tornie-beta" pre-release on every
  # push to the tornie-beta branch so Tornie's mod build is always
  # downloadable from the releases page alongside the stable main dev.
  tornie-release:
    needs: [build-windows, build-linux, build-macos]
    if: |
      always() &&
      !inputs.windows_only &&
      github.ref == 'refs/heads/tornie-beta' &&
      (needs.build-windows.result == 'success' || needs.build-linux.result == 'success' || needs.build-macos.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: DuneLegacyTornie-Windows-Installer
          path: dist/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: DuneLegacyTornie-macOS-DMG
          path: dist/macos

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: DuneLegacyTornie-Linux-Packages
          path: dist/linux

      - name: Update tornie-beta release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(sed -n 's/^project(DuneLegacyTornie VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' CMakeLists.txt)
          SHA="${GITHUB_SHA::8}"
          NOTES="Tornie Mod beta v${VERSION} (${SHA})\n\nAuto-built from tornie-beta @ $(date -u '+%Y-%m-%d %H:%M UTC')\n\nThe Tornie mod is bundled as the active mod. Use the in-game Mod menu to switch back to vanilla or to Tornie.\n\n**Downloads** (attached below)"

          # Delete old tornie-beta release if it exists, then create fresh
          gh release delete tornie-beta --yes 2>/dev/null || true
          git push origin :refs/tags/tornie-beta 2>/dev/null || true

          # Collect whatever artifacts succeeded
          shopt -s nullglob
          FILES=(dist/*/*)
          if [ ${#FILES[@]} -gt 0 ]; then
            echo -e "$NOTES" | gh release create tornie-beta "${FILES[@]}" \
              --title "Tornie Mod Beta v${VERSION}" \
              --notes-file - \
              --prerelease
          fi

  # Auto-publish a GitHub Release on every v* tag push. Pulls down the
  # three platform artifacts from this run and attaches them. The
  # in-game VersionChecker hits the GitHub Releases /latest endpoint,
  # so creating a release here automatically flips every existing
  # install's "update available" flag the next time they launch.
  release:
    needs: [verify-version, test-linux, validate-french-locale, build-windows, build-linux, build-macos]
    # Windows is required. Linux and macOS are attached when available.
    if: always() && !inputs.windows_only && startsWith(github.ref, 'refs/tags/v') && needs.verify-version.result == 'success' && needs.test-linux.result == 'success' && needs.validate-french-locale.result == 'success' && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: DuneLegacyTornie-Windows-Installer
          path: dist/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: DuneLegacyTornie-macOS-DMG
          path: dist/macos

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: DuneLegacyTornie-Linux-Packages
          path: dist/linux

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES_FILE="$(mktemp)"
          {
            echo "Dune Legacy Tornie ${TAG}"
            echo
            echo "Auto-built from tag ${TAG}. See the [CHANGELOG](https://github.com/${GITHUB_REPOSITORY}/commits/${TAG}) for what's in this release."
            echo
            echo "**Downloads** (attached below):"
            echo "- Windows: \`DuneLegacyTornie-*.zip\`"
            echo "- macOS: \`DuneLegacyTornie-*.dmg\`"
            echo "- Linux: \`.AppImage\` (recommended) / \`.deb\` / \`.rpm\` / \`.tar.gz\`"
            if compgen -G "dist/macos/*.dmg" > /dev/null; then
              echo
              echo "**Running on macOS:** the build is ad-hoc signed, so Gatekeeper blocks it on first launch (\"dunecity.app was blocked to protect your Mac\"). It's not damaged â€” approve it once: **System Settings â†’ Privacy & Security â†’ Open Anyway** (macOS 15/26), or right-click the app â†’ **Open** on macOS 14 and earlier. Details: https://github.com/Torneko/dunelegacy-tornie#building"
            fi
            echo
            echo "Upgrading from a previous Dune Legacy Tornie install? Your built-in mod INI files are reseeded automatically on first launch."
          } > "$NOTES_FILE"
          if [ -f "release_notes/${TAG}.md" ]; then
            cp "release_notes/${TAG}.md" "$NOTES_FILE"
          fi

          # If a release for this tag already exists (e.g. it was hand-
          # made first), upload the artifacts onto it; otherwise create
          # a fresh release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*/* --clobber
            gh release edit "$TAG" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" dist/*/* \
              --title "Dune Legacy Tornie ${TAG}" \
              --notes-file "$NOTES_FILE"
          fi
